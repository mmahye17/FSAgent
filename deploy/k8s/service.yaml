apiVersion: v1
kind: Service
metadata:
  name: fsagent-api
  labels:
    app: fsagent
spec:
  type: ClusterIP
  selector:
    app: fsagent
    component: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fsagent-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  rules:
    - host: fsagent.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fsagent-api
                port:
                  number: 80
