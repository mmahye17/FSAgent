apiVersion: v1
kind: ConfigMap
metadata:
  name: fsagent-config
data:
  APP_NAME: "FSAgent"
  APP_ENV: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  DATABASE_POOL_SIZE: "20"
  DATABASE_MAX_OVERFLOW: "10"
  SESSION_TTL_SECONDS: "1800"
  SESSION_MAX_MESSAGES: "50"
  WIKI_CACHE_TTL: "3600"
  WIKI_REFRESH_INTERVAL: "300"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_DEFAULT: "60/minute"
  RATE_LIMIT_WEBHOOK: "120/minute"
---
apiVersion: v1
kind: Secret
metadata:
  name: fsagent-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://fsagent:CHANGE_ME@postgres:5432/fsagent"
  REDIS_URL: "redis://redis:6379/0"
  LLM_API_KEY: "CHANGE_ME"
  LLM_BASE_URL: "https://api.openai.com/v1"
  EMBEDDING_API_KEY: "CHANGE_ME"
  JWT_SECRET_KEY: "CHANGE_ME_TO_RANDOM"
  FEISHU_APP_ID: "CHANGE_ME"
  FEISHU_APP_SECRET: "CHANGE_ME"
  FEISHU_VERIFICATION_TOKEN: "CHANGE_ME"
  WECHAT_CORP_ID: "CHANGE_ME"
  WECHAT_CORP_SECRET: "CHANGE_ME"
