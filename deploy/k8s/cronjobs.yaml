apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-contacts
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: sync-contacts
              image: fsagent:latest
              command: ["python", "scripts/cron/sync_contacts.py"]
              envFrom:
                - configMapRef:
                    name: fsagent-config
                - secretRef:
                    name: fsagent-secrets
          restartPolicy: OnFailure
---
