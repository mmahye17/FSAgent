apiVersion: apps/v1
kind: Deployment
metadata:
  name: fsagent-api
  labels:
    app: fsagent
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fsagent
      component: api
  template:
    metadata:
      labels:
        app: fsagent
        component: api
    spec:
      containers:
        - name: api
          image: fsagent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: fsagent-config
            - secretRef:
                name: fsagent-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/v1/admin/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/admin/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
